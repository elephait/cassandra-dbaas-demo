services:
  control-plane-db:
    image: postgres:17.6
    mem_limit: 512m
    ports: [ "127.0.0.1:15432:5432" ]
    environment:
      POSTGRES_DB: dbaas
      POSTGRES_USER: dbaas
      POSTGRES_PASSWORD: queue-demo-only
    volumes: [ "control-plane-db:/var/lib/postgresql/data" ]
    healthcheck:
      test: [ CMD-SHELL, "pg_isready -U dbaas -d dbaas" ]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  control-plane-db:
