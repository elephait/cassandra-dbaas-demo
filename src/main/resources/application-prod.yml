spring:
  datasource:
    url: ${DBAAS_CONTROL_PLANE_JDBC_URL}
    username: ${DBAAS_CONTROL_PLANE_DB_USER}
    password: ${DBAAS_CONTROL_PLANE_DB_PASSWORD}
